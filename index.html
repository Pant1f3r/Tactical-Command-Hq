<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KR0M3D1A | Tactical Command Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#09090b',       /* Zinc 950 */
              surface: '#18181b',  /* Zinc 900 */
              border: '#27272a',   /* Zinc 800 */
              muted: '#71717a',    /* Zinc 500 */
              primary: '#06b6d4',  /* Cyan 500 */
              secondary: '#8b5cf6',/* Purple 500 */
              warning: '#f59e0b',
              danger: '#ef4444',
              success: '#22c55e',
            }
          },
          fontFamily: {
            mono: ['Roboto Mono', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        },
      },
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;700&display=swap');

    :root {
      --brand-bg: #09090b;
      --brand-surface: #18181b;
      --brand-border: #27272a;
      --brand-primary: #06b6d4;

      --sidebar-width: 260px;
      --sidebar-collapsed-width: 64px;
      --header-height: 72px;
      --footer-height: 64px;
    }

    body {
      background-color: var(--brand-bg);
      color: #fafafa;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: grid;
      grid-template-areas: 
        "sidebar header"
        "sidebar main"
        "sidebar footer";
      grid-template-columns: var(--sidebar-width) 1fr;
      grid-template-rows: var(--header-height) 1fr var(--footer-height);
      height: 100vh;
      width: 100vw;
      transition: grid-template-columns 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-shell.collapsed {
      grid-template-columns: var(--sidebar-collapsed-width) 1fr;
    }

    .header-zone { 
      grid-area: header; 
      border-bottom: 1px solid var(--brand-border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      background-color: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(20px);
      z-index: 40;
    }

    .sidebar-zone { 
      grid-area: sidebar; 
      border-right: 1px solid var(--brand-border);
      background-color: var(--brand-surface);
      display: flex;
      flex-direction: column;
      z-index: 50;
      overflow: hidden;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    .main-zone { 
      grid-area: main; 
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2rem;
      position: relative;
    }

    .footer-zone {
      grid-area: footer;
      border-top: 1px solid rgba(6, 182, 212, 0.3);
      background-color: #09090b;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 40;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
    }

    h1 { @apply text-2xl font-extrabold tracking-tight; }
    h2 { @apply text-xl font-bold tracking-tight; }
    h3 { @apply text-lg font-semibold; }
    .text-caption { @apply text-[10px] font-black uppercase tracking-[0.3em] text-brand-muted font-mono; }

    .glass-card {
      @apply bg-brand-surface border border-brand-border rounded-lg shadow-sm transition-all;
    }
    
    .glass-card:hover {
      @apply border-brand-primary/30 shadow-2xl;
    }

    .btn-action {
      @apply flex items-center gap-2 px-4 py-2 rounded-md text-sm font-semibold transition-all active:scale-[0.98] disabled:opacity-50;
    }

    .btn-primary { @apply bg-brand-primary text-brand-bg hover:bg-brand-primary/90; }
    .btn-secondary { @apply bg-brand-surface border border-brand-border text-white hover:bg-brand-border; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 10px; border: 2px solid var(--brand-bg); }

    @media (max-width: 1024px) {
      .app-shell {
        grid-template-areas: 
          "header"
          "main"
          "footer";
        grid-template-columns: 1fr;
        grid-template-rows: var(--header-height) 1fr var(--footer-height);
      }
      .sidebar-zone { display: none; }
      .main-zone { padding: 1rem; }
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-brand-bg">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
